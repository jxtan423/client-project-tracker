<app-dialog
    [title]="task ? 'Edit task' : 'Create task'"
    [busy]="busy"
    (dismissed)="dismissed.emit()"
  >
    <form (ngSubmit)="submit()" novalidate>
      <div class="dialog-body">
        @if (error) {
          <p class="error-banner" role="alert">{{ error }}</p>
        }
        <label class="field"
          >Task title *<input
            name="title"
            [(ngModel)]="title"
            [disabled]="busy"
            required
        /></label>
        @if (validation) {
          <p class="field-error" role="alert">{{ validation }}</p>
        }
        <label class="field"
          >Status<select name="status" [(ngModel)]="status" [disabled]="busy">
            <option value="todo">To do</option>
            <option value="in_progress">In progress</option>
            <option value="completed">Completed</option>
          </select></label
        >
        <label class="field"
          >Due date<input
            name="dueDate"
            type="date"
            [(ngModel)]="dueDate"
            [disabled]="busy"
            min="0001-01-01"
            max="9999-12-31"
        /></label>
        <p class="field-hint">
          Leave the date empty if there is no deadline. Assignment will be
          available in the member-management step.
        </p>
      </div>
      <footer class="dialog-actions">
        <button
          type="button"
          class="button button-secondary"
          [disabled]="busy"
          (click)="dismissed.emit()"
        >
          Cancel</button
        ><button type="submit" class="button button-primary" [disabled]="busy">
          @if (busy) { <span class="spinner spinner-small" aria-hidden="true"></span> } {{ busy ? "Saving…" : "Save task" }}
        </button>
      </footer>
    </form></app-dialog
  >
