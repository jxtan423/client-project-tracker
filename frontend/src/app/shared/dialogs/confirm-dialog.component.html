<app-dialog [title]="title" [busy]="busy" (dismissed)="dismissed.emit()">
  <div class="dialog-body">
    <div class="delete-symbol" aria-hidden="true">!</div>
    <p>{{ message }}</p>
    @if (error) {
      <p class="error-banner" role="alert">{{ error }}</p>
    }
  </div>
  <footer class="dialog-actions">
    <button
      type="button"
      class="button button-secondary"
      autofocus
      [disabled]="busy"
      (click)="dismissed.emit()"
    >
      Cancel
    </button>
    <button
      type="button"
      class="button"
      [class.button-danger]="destructive"
      [class.button-primary]="!destructive"
      [disabled]="busy"
      (click)="confirmed.emit()"
    >
      @if (busy) {
        <span class="spinner spinner-small" aria-hidden="true"></span>
      }
      {{ busy ? busyLabel : confirmLabel }}
    </button>
  </footer>
</app-dialog>
