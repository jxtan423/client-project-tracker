name: client-project-tracker

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: client_project_tracker
      POSTGRES_USER: tracker
      # Password-free access for this local development setup.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
